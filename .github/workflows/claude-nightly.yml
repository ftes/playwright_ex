# Accepted risk (.github/actions/claude): with an id-token, `fix` runs a nightly PR branch's setup
# code. Only claude/nightly-* branches.
name: Claude Nightly Improvement

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

# One run at a time, so two runs can't both take the last slot.
concurrency:
  group: claude-nightly
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  # As in elixir.yml.
  MIX_ENV: test

jobs:
  # Frees slots before the cap is counted. A job, not an earlier cron: GitHub delays scheduled
  # runs, and only `needs` guarantees the order.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Exchanged for the Claude app token, which closes the PRs.
    outputs:
      redo: ${{ steps.redo.outputs.redo }}
    steps:
      - name: List open nightly PRs without human comments or reviews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A human comment or review keeps a PR out of triage; Claude's own review doesn't. The
        # allowlist names each PR, so Claude can't read or close any other.
        run: |
          numbers=$(gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,comments,reviews \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | .number]')
          {
            echo "numbers=$(jq -r 'join(" ")' <<< "$numbers")"
            echo "allowed=$(jq -r 'map("Bash(gh pr close \(.) *),Bash(gh pr view \(.)),Bash(gh pr view \(.) *),Bash(gh pr diff \(.)),Bash(gh pr diff \(.) *)") | join(",")' <<< "$numbers")"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.list.outputs.numbers != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's Claude action, also on a workflow_dispatch from another branch.
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: claude
        if: steps.list.outputs.numbers != ''
        uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          setup: none
          prompt: nightly-triage
          context: |
            REPO: ${{ github.repository }}
            OPEN NIGHTLY PRS: ${{ steps.list.outputs.numbers }}
          max-turns: "60"
          allowed-tools: "Skill,Read,Grep,Glob,Agent,Task,StructuredOutput,Bash(git log:*),Bash(git show:*),Bash(git diff:*),${{ steps.list.outputs.allowed }}"
          json-schema: '{"type":"object","properties":{"redo":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"why":{"type":"string"}},"required":["number","why"]}}},"required":["redo"]}'
      - name: Keep the redo verdicts of listed PRs
        id: redo
        if: ${{ !cancelled() }}
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          NUMBERS: ${{ steps.list.outputs.numbers }}
        # Claude's answer is data: only the PRs it was given, and a `why` cut to one line.
        run: |
          redo=$(jq -cn --arg numbers "$NUMBERS" '($numbers | split(" ") | map(select(. != "") | tonumber)) as $listed
            | (env.OUTPUT | try fromjson catch {}) | (.redo // [])
            | map(select(.number as $n | $listed | any(. == $n)) | {number, why: (.why | tostring | gsub("\\s+"; " ") | .[:200])})
            | unique_by(.number)')
          echo "::notice::To redo: $(jq -r 'map("#\(.number)") | join(" ")' <<< "$redo")"
          echo "redo=$redo" >> "$GITHUB_OUTPUT"

  # After triage, so only PRs worth keeping get fixed.
  classify:
    needs: triage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Deletes the branch of a PR given up on.
      pull-requests: write # Closes that PR.
      # Read by statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      recreate: ${{ steps.list.outputs.recreate }}
      failing: ${{ steps.list.outputs.failing }}
    steps:
      - name: Sort open nightly PRs without human comments or reviews by what they need
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_COMMITS: 3
          # Triage's PRs to redo on current main; none if it failed.
          REDO: ${{ needs.triage.outputs.redo || '[]' }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A human comment or review keeps a PR from being changed under them. A PR lists
        # every run of a check, so only each check's latest counts. Every fix or re-run adds a
        # commit, so the commit count limits the attempts. Listing commits caps --limit at 40: more
        # exceeds GitHub's GraphQL node limit. A PR to recreate (conflicted, or triage's redo) isn't
        # fixed or given up on as well: its replacement gets a CI run of its own.
        run: |
          list() {
            gh pr list --state open --limit 40 --json number,headRefName,isCrossRepository,mergeable,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | {number, branch: .headRefName, mergeable, commits: (.commits | length), failing: ([.statusCheckRollup[] | select(.workflowName == "Elixir CI")] | group_by(.name) | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))}]'
          }
          list > /dev/null
          sleep 30
          prs=$(list)
          # Still open and listed: triage may have closed it, or a human commented since.
          recreate=$(jq -c --argjson redo "$REDO" '. as $prs
            | ($redo | map(select(.number as $n | $prs | any(.number == $n))))
              + map(select(.mergeable == "CONFLICTING") | {number, why: "It conflicts with main."})
            | unique_by(.number)' <<< "$prs")
          others=$(jq -c --argjson recreate "$recreate" 'map(select(.number as $n | $recreate | all(.number != $n)))' <<< "$prs")
          {
            echo "recreate=$recreate"
            echo "failing=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits < $max) | {number, branch})' <<< "$others")"
            echo "exhausted=$(jq -r --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits >= $max) | .number) | join(" ")' <<< "$others")"
          } >> "$GITHUB_OUTPUT"
      - name: Close PRs still failing after two fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.list.outputs.exhausted }}
        run: |
          for number in $NUMBERS; do
            gh pr close "$number" --delete-branch --comment "CI still fails after two automatic fixes."
          done

  # Pushes a fix to each PR whose CI failed, which is where a change gets tested: improve publishes
  # without running the suite.
  fix:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.failing != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # gh run view, for the failed log.
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.failing) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
      # The Claude actions and prompts from main, not from the ref checked out above
      # (.github/actions/claude): into a gitignored path, after that checkout, which would clean it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tmp/default-branch
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./tmp/default-branch/.github/actions/fix-ci
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          kind: nightly
          pr: ${{ matrix.pr.number }}
          branch: ${{ matrix.pr.branch }}

  # Replaces each conflicted PR, and each that triage found no longer fits main, with one on a new
  # branch from main. The Claude app can't push workflow file changes, which a merge or rebase of
  # the old branch would carry from main.
  recreate:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.recreate != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.recreate) }}
    env:
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}-${{ matrix.pr.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's Claude action and code, also on a workflow_dispatch from another branch.
          ref: main
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      - run: git switch -c "$NIGHTLY_BRANCH"
      - uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: nightly-recreate
          context: |
            REPO: ${{ github.repository }}
            OLD_PR: ${{ matrix.pr.number }}
            WHY: ${{ matrix.pr.why }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out, from current main)
          max-turns: "60"
          allowed-tools: "Skill,Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(mix playwright.parity:*),Bash(mix playwright.gen.api:*),Bash(mix playwright.gen.protocol:*),Bash(gh pr view ${{ matrix.pr.number }}),Bash(gh pr view ${{ matrix.pr.number }} *),Bash(gh pr diff ${{ matrix.pr.number }}),Bash(gh pr diff ${{ matrix.pr.number }} *),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *),Bash(gh pr close ${{ matrix.pr.number }} *)"

  # Enforces the cap before any toolchain is set up. Runs even if an earlier job failed: the
  # count is still right, it just finds fewer slots.
  capacity:
    needs: [fix, recreate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      has-slot: ${{ steps.count.outputs.has-slot }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Count open nightly PRs
        id: count
        # With pipefail, so a failed lookup in the pipeline below shows.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_OPEN_PRS: 3
        # Same-repo branches only: a fork can pick any branch name, and this repo is public.
        run: |
          prs=$(gh pr list --state all --limit 1000 --json number,title,state,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-"))) | {number, title, state}]')
          open=$(jq '[.[] | select(.state == "OPEN")] | length' <<< "$prs")
          echo "::notice::$open of $MAX_OPEN_PRS nightly PRs open"
          if [ "$open" -lt "$MAX_OPEN_PRS" ]; then has_slot=true; else has_slot=false; fi
          # Why each closed PR was declined: its maintainers' comments and reviews, and the closing
          # comment of claude[bot] or github-actions[bot] (by REST, whose logins tell bots from
          # users). Only theirs reach the prompt.
          recent=$(jq -c '.[:30]' <<< "$prs")
          # shellcheck disable=SC2016 # jq's $closed and $bots
          for number in $(jq -r '.[] | select(.state == "CLOSED") | .number' <<< "$recent"); do
            why=$(gh pr view "$number" --json closedAt,comments,reviews > "$RUNNER_TEMP/pr.json" &&
              gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
                --jq '.[] | select(.user.type == "Bot" and (.user.login | IN("claude[bot]", "github-actions[bot]"))) | {body, createdAt: .created_at}' |
                jq -s . > "$RUNNER_TEMP/bots.json" &&
              jq -c --slurpfile bots "$RUNNER_TEMP/bots.json" '(.closedAt | fromdate) as $closed
                | [.comments[], .reviews[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))]
                  + [$bots[0][] | select((.createdAt | fromdate) >= $closed - 120)]
                | map(.body | gsub("\\s+"; " ") | .[:300] | select(. != ""))' "$RUNNER_TEMP/pr.json") ||
              { echo "::warning::Couldn't read why #$number was closed."; why='[]'; }
            recent=$(jq -c --argjson n "$number" --argjson why "$why" 'map(if .number == $n then . + {why: $why} else . end)' <<< "$recent")
          done
          {
            echo "has-slot=$has_slot"
            echo "prs=$recent"
          } >> "$GITHUB_OUTPUT"

  improve:
    needs: capacity
    # !cancelled(): the implicit success() would also fail on any failed or skipped job further up.
    if: ${{ !cancelled() && needs.capacity.outputs.has-slot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token. PRs from GITHUB_TOKEN wouldn't trigger CI.
    env:
      # The run's only branch: the exact push and PR commands below allow no other, and GitHub
      # refuses a second PR for one head, so a run opens at most one.
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's Claude action and code, also on a workflow_dispatch from another branch.
          ref: main
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      - run: git switch -c "$NIGHTLY_BRANCH"
      - name: Pick tonight's focus area
        id: focus
        # By day of the year, so successive nights look at different parts of the code.
        run: |
          areas=(
            "the runtime and top-level modules (ours): lib/playwright/runtime/, transport/ and lib/playwright/*.ex"
            "the ported API modules: lib/playwright/api/"
            "the ported client modules: lib/playwright/client/"
            "the ported isomorphic, protocol and matcher modules: lib/playwright/isomorphic/, protocol/, matchers/"
            "tooling (ours): lib/mix/ and dev/ (generators, parity)"
            "the tests: test/support/, test/upstream/ (ported) and the tests outside it"
          )
          area=${areas[$((10#$(date -u +%j) % ${#areas[@]}))]}
          echo "::notice::Focus: $area"
          echo "area=$area" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: nightly-improve
          context: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out)
            PREVIOUS NIGHTLY PRS, newest first: ${{ needs.capacity.outputs.prs }}
            FOCUS: ${{ steps.focus.outputs.area }}
          max-turns: "150"
          allowed-tools: "Skill,Read,Grep,Glob,Edit,Write,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(mix playwright.parity:*),Bash(mix playwright.gen.api:*),Bash(mix playwright.gen.protocol:*),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *)"
