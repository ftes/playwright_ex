# Branch-only entry point: GitHub registers workflow_dispatch files from main.
name: Historical upstream port replay

on: workflow_dispatch

permissions: {}

jobs:
  replay:
    if: github.ref == 'refs/heads/upstream-pilot-replay-workflow' && github.actor == github.repository_owner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/upstream-port-pilot.yml
    with:
      version: "1.65.1"
      replay: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
