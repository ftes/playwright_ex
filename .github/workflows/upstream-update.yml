# Opens a draft PR porting a new upstream Playwright release (PORTING.md "Bumping the pinned
# version"), and pushes fixes for that PR's CI failures. Goes live only once this file is on the default branch (main), i.e. after the
# restructure PR merges: GitHub runs schedules from the default branch only, lists
# workflow_dispatch workflows from it only, and claude-code-action's token exchange rejects a
# workflow file that differs from the default branch's.
#
# Owner setup: the Claude GitHub App installed on the repo and the CLAUDE_CODE_OAUTH_TOKEN
# secret (both already used by claude-code-review.yml). Recommended: a ruleset on main
# requiring PRs, so no token can push to main whatever the prompt says.
name: Upstream update

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour (top-of-hour schedules are delayed or dropped)
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version (X.Y.Z), default: npm's latest. Also retries a release whose PR was closed."
        required: false
        type: string

# One run at a time and no cancelling: a queued run waits for the port in progress, then finds
# its branch and stops in `check`.
concurrency:
  group: upstream-update
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  # Steers Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist. Plain text
  # only (no quotes, $ or backslashes): claude.yml passes it in a quoted claude_args argument.
  TOOL_HINT: "Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules."

jobs:
  # Cheap, no Claude: is there a newer stable release without a branch or PR for it?
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read DRIVER_VERSION and mix.exs
      pull-requests: read # gh pr list (dedup)
    outputs:
      update: ${{ steps.check.outputs.update }}
      from: ${{ steps.check.outputs.from }}
      to: ${{ steps.check.outputs.to }}
      version: ${{ steps.check.outputs.version }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            DRIVER_VERSION
            mix.exs
          sparse-checkout-cone-mode: false
      - name: Find a newer upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not interpolated into the script (injection).
          TARGET: ${{ inputs.version }}
        run: .github/scripts/upstream-check.sh "$TARGET"

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    # A minor release can mean hours of porting; GitHub-hosted jobs stop at 6 h anyway.
    timeout-minutes: 240
    permissions:
      # The workflow token only checks out. Claude pushes and opens the PR
      # with the Claude GitHub App's installation token, which the action gets by exchanging
      # this job's OIDC token (id-token: write) at api.anthropic.com
      # (contents/pull-requests/issues: write on this repo only). Unlike GITHUB_TOKEN, an app
      # token's push and PR do trigger workflows, so elixir.yml runs on the PR as on any other.
      contents: read
      id-token: write
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup languages
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # The FROM driver; Claude reinstalls after bumping (--with-deps covers the OS packages).
      - name: Install driver and browsers
        run: mix playwright_ex.install -- chromium --with-deps
      - name: Build prompt
        id: prompt
        env:
          FROM: ${{ needs.check.outputs.from }}
          TO: ${{ needs.check.outputs.to }}
          VERSION: ${{ needs.check.outputs.version }}
          BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          # The upstream clone (see the prompt) lives outside the checkout; --add-dir needs it.
          mkdir -p /tmp/playwright
          {
            echo "prompt<<PROMPT_EOF"
            echo "FROM: $FROM"
            echo "TO: $TO"
            echo "VERSION: $VERSION"
            echo "BRANCH: $BRANCH"
            echo "RELEASE: https://github.com/microsoft/playwright/releases/tag/v$TO"
            echo
            cat .github/prompts/upstream-update.md
            echo
            echo "$TOOL_HINT"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Port the release
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No github_token input: that makes the action use the Claude App token (see above).
          prompt: ${{ steps.prompt.outputs.prompt }}
          # The owner forbids attribution; the prompt says so too.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
          # Tools: file tools and subagents; mix (build, generators, tests), git (upstream
          # fetch/diff, commits, push), gh (release notes, PR), curl (playwright-python's
          # NODE_VERSION); a few read-only shell helpers. Prefix rules can't fence pushes
          # tightly, so the denials are a backstop; main's ruleset is the real guard.
          # --add-dir: the upstream clone, and the driver cache holding the TO sources
          # (PlaywrightEx.Upstream).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 600
            --add-dir /tmp/playwright /home/runner/.cache/playwright_ex
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Agent,Task,TodoWrite,Bash(mix:*),Bash(MIX_ENV=test mix:*),Bash(git:*),Bash(gh:*),Bash(curl:*),Bash(ls:*),Bash(mkdir:*),Bash(wc:*),Bash(diff:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh repo:*),Bash(gh workflow:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push --force:*),Bash(git push -f:*)"

  # Claude's finished ports whose CI failed. A PR left "in progress" by a run that stopped early is
  # not worth fixing, and one a human has commented on or pushed to is theirs.
  failing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Read by statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: List ports with failing CI
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A PR lists every run of a check, so only each check's latest counts. Commits
        # are told apart by author name: the action's default bot ID isn't Claude's account, so the
        # login isn't reliable. A port has many commits, so only fix commits count as attempts.
        # Listing commits caps --limit at 40: more exceeds GitHub's GraphQL node limit.
        run: |
          list() {
            gh pr list --state open --limit 40 --json number,headRefName,isCrossRepository,mergeable,body,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("upstream/")) and .mergeable != "CONFLICTING" and (.body | startswith("Port in progress") | not) and ([.comments[], .reviews[]] | all(.author.login == "claude")) and (any(.comments[]; .body | startswith("Needs a human:")) | not) and ([.commits[].authors[].name] | all(. == "claude[bot]")) and ([.commits[] | select(.messageHeadline | test("^(Fix CI:|Re-run CI$)"))] | length < 3) and ([.statusCheckRollup[] | select(.workflowName == "Elixir CI")] | group_by(.name) | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))) | {number, branch: .headRefName}]'
          }
          list > /dev/null
          sleep 30
          echo "prs=$(list)" >> "$GITHUB_OUTPUT"

  # The port job tests chromium only, so this is where the other browsers' failures get fixed.
  # Only new commits, nothing merged from main, so no workflow files (the app can't push those).
  fix:
    needs: failing
    if: needs.failing.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # gh run view, for the failed log.
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.failing.outputs.prs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
      - name: Setup languages
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # May fail on a branch that doesn't compile; Claude then runs without them.
      - name: Download upstream sources
        continue-on-error: true
        run: mkdir -p ~/.cache/playwright_ex && mix playwright_ex.upstream
      - name: Save the failed CI log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.pr.branch }}
        run: |
          run=$(gh run list --branch "$BRANCH" --workflow elixir.yml --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId')
          mkdir -p tmp
          gh run view "$run" --log-failed | tail -n 5000 > tmp/ci-failed.log
      - name: Fix the port
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ matrix.pr.number }}
            BRANCH: ${{ matrix.pr.branch }} (already checked out)

            CI failed on this draft PR porting a Playwright release. The end of the failed steps'
            log is in tmp/ci-failed.log (tmp/ is gitignored).

            Read PORTING.md, the log and `gh pr view ${{ matrix.pr.number }}`, and find the cause.
            Compare a failing port or ported test with upstream: its sources and specs at the new
            pin are under ~/.cache/playwright_ex/<version>/upstream. Tests can't run here: CI runs
            them on your push. Don't merge or rebase on main. End with exactly one of these:

            - The port caused it: fix it 1:1 per PORTING.md. Files marked "do not edit manually" are
              regenerated with `mix playwright_ex.gen.api` or `mix playwright_ex.gen.protocol`.
              Don't weaken or skip a test to get it green. Run `mix format`,
              `mix compile --warnings-as-errors`, `mix credo` and `mix playwright_ex.parity`,
              `git add` the files, commit with "Fix CI: <one imperative sentence>" as the subject,
              then run exactly:
                git push origin ${{ matrix.pr.branch }}
            - It is unrelated to the port, like a flaky browser test: run exactly
              `git commit --allow-empty -m "Re-run CI"`, then the push above.
            - It needs a decision, a skip or more than a fix: run exactly
              gh pr comment ${{ matrix.pr.number }} --body "Needs a human: <one sentence on why>"

            ${{ env.TOOL_HINT }}

            No attribution anywhere: no Co-Authored-By trailers or "Generated with" lines.
          # The owner forbids attribution; the prompt says so too.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
          # --add-dir: the driver cache holding the upstream sources (PlaywrightEx.Upstream).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --add-dir /home/runner/.cache/playwright_ex
            --allowedTools "Read,Grep,Glob,Edit,Write,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(mix playwright_ex.parity:*),Bash(mix playwright_ex.gen.api:*),Bash(mix playwright_ex.gen.protocol:*),Bash(gh pr view ${{ matrix.pr.number }}:*),Bash(git push origin ${{ matrix.pr.branch }}),Bash(gh pr comment ${{ matrix.pr.number }} *)"
