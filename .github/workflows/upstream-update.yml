# Opens a draft PR porting a new upstream Playwright release (PORTING.md "Bumping the pinned
# version"), and pushes fixes for that PR's CI failures. Runs from the default branch (main):
# Only the publisher jobs can write. Build and generation never run in a job with OIDC.
name: Upstream update

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour (top-of-hour schedules are delayed or dropped)
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version (X.Y.Z), default: npm's latest. Also retries a release whose PR was closed."
        required: false
        type: string

# One run at a time and no cancelling: a queued run waits for the port in progress, then finds
# its branch and stops in `check`.
concurrency:
  group: upstream-update
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  # As in ci.yml, so a fix compiles what CI failed on.
  MIX_ENV: test
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read # read DRIVER_VERSION and mix.exs
      pull-requests: read # gh pr list (dedup)
    outputs:
      update: ${{ steps.check.outputs.update }}
      from: ${{ steps.check.outputs.from }}
      to: ${{ steps.check.outputs.to }}
      from-sha: ${{ steps.pins.outputs.from-sha }}
      to-sha: ${{ steps.pins.outputs.to-sha }}
      node: ${{ steps.pins.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            DRIVER_VERSION
            NODE_VERSION
            mix.exs
          sparse-checkout-cone-mode: false
      - name: Find a newer upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not interpolated into the script (injection).
          TARGET: ${{ inputs.version }}
        run: .github/scripts/upstream-check.sh "$TARGET"
      - id: pins
        if: steps.check.outputs.update == 'true'
        env:
          FROM: ${{ steps.check.outputs.from }}
          TO: ${{ steps.check.outputs.to }}
        run: bash .github/scripts/upstream-source.sh resolve

  prepare:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.sha }}
      FROM_SHA: ${{ needs.check.outputs.from-sha }}
      TO_SHA: ${{ needs.check.outputs.to-sha }}
      FROM: ${{ needs.check.outputs.from }}
      TO: ${{ needs.check.outputs.to }}
      NODE: ${{ needs.check.outputs.node }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      tree: ${{ steps.seal.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash .github/scripts/upstream-source.sh fetch
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
      - name: Generate the checkpoint and materialize the pinned source diff
        id: seal
        shell: bash
        run: |
          export PW_UPSTREAM="$RUNNER_TEMP/playwright-source"
          mix playwright.checksums "$TO" "$NODE"
          mix run -e 'Playwright.Driver.install(force: true)'
          mix playwright.gen.protocol "$PW_UPSTREAM"
          mix playwright.gen.api "$PW_UPSTREAM"
          cp "$PW_UPSTREAM/tests/registry.md" test/upstream_registry.md
          mkdir "$RUNNER_TEMP/port-prep"
          {
            printf 'Playwright %s (%s) → %s (%s)\n\n' "$FROM" "$FROM_SHA" "$TO" "$TO_SHA"
            git -C "$PW_UPSTREAM" diff --stat "$FROM_SHA" "$TO_SHA"
            git -C "$PW_UPSTREAM" diff --no-ext-diff --no-textconv "$FROM_SHA" "$TO_SHA" -- \
              packages/playwright-core/src/client packages/playwright/src/matchers \
              packages/playwright/src/worker packages/playwright/src/runner \
              packages/playwright/src/reporters tests/page tests/library docs/src \
              ':(exclude)tests/**/assets/**'
          } > "$RUNNER_TEMP/port-prep/upstream.diff"
          git add -A
          python3 -I -B .github/scripts/upstream-port.py prepare
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-prep-${{ github.run_attempt }}
          path: ${{ runner.temp }}/port-prep/
          if-no-files-found: error

  checkpoint:
    needs: [check, prepare]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
      pr: ${{ steps.publish.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/port-prep
          merge-multiple: true
      - name: Publish the draft checkpoint
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ env.BASE_BRANCH }}
          BASE_SHA: ${{ github.sha }}
          TO: ${{ needs.check.outputs.to }}
          NODE: ${{ needs.check.outputs.node }}
          SEALED_TREE: ${{ needs.prepare.outputs.tree }}
          RETRY: ${{ inputs.version != '' }}
        run: python3 -I -B .github/scripts/upstream-port.py checkpoint

  plan:
    needs: [check, prepare, checkpoint]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: ftes/ci/opencode-install@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checkpoint.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/port-prep
          merge-multiple: true
      - id: auth
        uses: ftes/ci/opencode-auth@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Edit the exported checkpoint without shell access
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ env.BASE_BRANCH }}
          BASE_SHA: ${{ github.sha }}
          CHECKPOINT_SHA: ${{ needs.checkpoint.outputs.head }}
          TO: ${{ needs.check.outputs.to }}
          NODE: ${{ needs.check.outputs.node }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
        run: python3 -I -B .github/scripts/upstream-port.py plan
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/port-proposal/
          if-no-files-found: error

  verify:
    needs: [check, checkpoint, plan]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.sha }}
      CHECKPOINT_SHA: ${{ needs.checkpoint.outputs.head }}
      FROM_SHA: ${{ needs.check.outputs.from-sha }}
      TO_SHA: ${{ needs.check.outputs.to-sha }}
      TO: ${{ needs.check.outputs.to }}
      NODE: ${{ needs.check.outputs.node }}
      BROWSER: chromium
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      tree: ${{ steps.seal.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checkpoint.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/port-proposal
          merge-multiple: true
      - run: bash .github/scripts/upstream-source.sh fetch
      - run: python3 -I -B .github/scripts/upstream-port.py apply
      - uses: ftes/ci/setup@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
      - uses: ftes/ci/playwright-browser@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
        with:
          driver-dir: .
      - name: Regenerate and seal the final patch
        id: seal
        shell: bash
        run: |
          export PW_UPSTREAM="$RUNNER_TEMP/playwright-source"
          mix run -e 'Playwright.Driver.install(force: true)'
          mix playwright.gen.protocol "$PW_UPSTREAM"
          git diff --exit-code HEAD -- DRIVER_VERSION NODE_VERSION priv/driver_checksums.exs \
            lib/playwright/protocol/validator.ex lib/playwright/protocol/metainfo.ex
          mix playwright.gen.api "$PW_UPSTREAM"
          mix format
          git add -A
          python3 -I -B .github/scripts/upstream-port.py checked
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"
      # Upload before tests can change the workspace. Only a successful verify job can publish it.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-checked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/port-checked/
          if-no-files-found: error
      - name: Check the sealed candidate
        shell: bash
        env:
          SEALED_TREE: ${{ steps.seal.outputs.tree }}
        run: |
          export PW_UPSTREAM="$RUNNER_TEMP/playwright-source"
          test "$(git write-tree)" = "$SEALED_TREE"
          git diff --exit-code
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo
          mix playwright.parity
          mix playwright.gen.api --check "$PW_UPSTREAM"
          mix test --warnings-as-errors
          git diff --exit-code
          test "$(git write-tree)" = "$SEALED_TREE"

  publish:
    needs: [check, checkpoint, verify]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checkpoint.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: ${{ runner.temp }}/port-checked
          merge-multiple: true
      - name: Revalidate and update the draft without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ env.BASE_BRANCH }}
          BASE_SHA: ${{ github.sha }}
          CHECKPOINT_SHA: ${{ needs.checkpoint.outputs.head }}
          TO: ${{ needs.check.outputs.to }}
          NODE: ${{ needs.check.outputs.node }}
          PR: ${{ needs.checkpoint.outputs.pr }}
          SEALED_TREE: ${{ needs.verify.outputs.tree }}
        run: python3 -I -B .github/scripts/upstream-port.py finish

  failing:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: Snapshot completed ports with failing CI
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Commit listing is limited to 40 PRs by GitHub's GraphQL node limit.
        run: |
          list() {
            gh pr list --state open --limit 40 \
              --json number,headRefName,headRefOid,baseRefName,isCrossRepository,mergeable,body,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and .baseRefName == env.BASE_BRANCH
                and (.headRefName | test("^upstream/[0-9]+\\.[0-9]+\\.[0-9]+$"))
                and .mergeable == "MERGEABLE" and (.body | startswith("Port in progress") | not)
                and ([.comments[], .reviews[]] | all(.author.login | IN("claude", "opencode-agent", "coderabbitai")))
                and (any(.comments[]; .body | startswith("Needs a human:")) | not)
                and ([.commits[].authors[].name] | all(. | IN("claude[bot]", "opencode-agent[bot]")))
                and ([.commits[] | select(.messageHeadline | test("^(Fix CI:|Re-run CI$)"))] | length < 3)
                and ([.statusCheckRollup[] | select(.workflowName == "CI")] | group_by(.name)
                  | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT")))
                | {number, branch: .headRefName, head: .headRefOid, failing: true}]'
          }
          list > /dev/null
          sleep 30
          echo "prs=$(list)" >> "$GITHUB_OUTPUT"

  fix:
    needs: failing
    if: needs.failing.outputs.prs != '' && needs.failing.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.failing.outputs.prs) }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    uses: ftes/ci/.github/workflows/scheduled-candidate.yml@2b6de2fc7f6a22cb5b50cf34ac5353ac95def791
    with:
      mode: fix
      upstream-repair: true
      base: ${{ github.event.repository.default_branch }}
      checkout-sha: ${{ matrix.pr.head }}
      client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      runner: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      key: ${{ format('upstream-{0}', matrix.pr.number) }}
      targets: ${{ format('[{0}]', toJSON(matrix.pr)) }}
      prompt: |
        Fix the port's CI failure. Read the saved PR metadata, diff and tmp/ci-failed.log.
        Compare behavior with the pinned upstream sources in tmp/upstream-source/.
        Follow AGENTS.md and PORTING.md. Don't hand-edit generated protocol files or
        skip or weaken tests. The check job verifies the exact patch and port parity.

        Return fix with a short imperative title; retry only for an unrelated failure
        with no edits; or give-up with a reason when generation or a human decision
        is required. Return an empty threads list.
