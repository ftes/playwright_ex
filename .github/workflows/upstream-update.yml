name: Upstream release notice

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable upstream version (X.Y.Z); defaults to npm's latest."
        type: string

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/upstream-check.sh
            DRIVER_VERSION
          sparse-checkout-cone-mode: false
      - name: Check for a stable Playwright release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.version }}
        run: .github/scripts/upstream-check.sh "$TARGET"
      - name: Retain the notice for deduplication
        if: steps.check.outputs.notice != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.check.outputs.notice }}
          path: ${{ runner.temp }}/upstream-notice.md
          if-no-files-found: error
