name: Upstream update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version (X.Y.Z), default: npm's latest. Also retries a release whose PR was closed."
        required: false
        type: string

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions: {}

env:
  MIX_ENV: test
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update: ${{ steps.check.outputs.update }}
      from: ${{ steps.check.outputs.from }}
      to: ${{ steps.check.outputs.to }}
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            DRIVER_VERSION
            mix.exs
          sparse-checkout-cone-mode: false
      - name: Find a newer upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.version }}
        run: .github/scripts/upstream-check.sh "$TARGET"

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Install driver and browser
        uses: ftes/ci/playwright-browser@e53e22699f50c88157237931a10500d367cca47c # v1.0.13
        with:
          driver-dir: .
      - name: Fetch the exact upstream tags and port instructions
        shell: bash
        env:
          FROM: ${{ needs.check.outputs.from }}
          TO: ${{ needs.check.outputs.to }}
        run: |
          git init -q tmp/opencode-upstream
          git -C tmp/opencode-upstream fetch --depth=1 https://github.com/microsoft/playwright tag "v$FROM" tag "v$TO"
          mkdir -p tmp/scheduled
          cp .github/prompts/upstream-update.md tmp/scheduled/upstream-update.md
          curl -fsSL --retry 3 "https://api.github.com/repos/microsoft/playwright/releases/tags/v$TO" \
            | jq -er .body > tmp/scheduled/upstream-release.md
      - name: Prepare and publish the port
        uses: ftes/ci/opencode-scheduled@e4c1ffa77b35270481b125b4c9bc76ddeeea47b2 # ftes/ci#18
        with:
          mode: upstream
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
          base: ${{ env.BASE_BRANCH }}
          version: ${{ needs.check.outputs.to }}
          prompt: |
            Follow tmp/scheduled/upstream-update.md. The upstream release notes are in
            tmp/scheduled/upstream-release.md. FROM is ${{ needs.check.outputs.from }}.
            TO is ${{ needs.check.outputs.to }}. The next port version is ${{ needs.check.outputs.version }}.

  failing:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      base: ${{ steps.list.outputs.base }}
    steps:
      - name: Snapshot completed ports with failing CI
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Commit listing is limited to 40 PRs by GitHub's GraphQL node limit.
        run: |
          list() {
            gh pr list --state open --limit 40 \
              --json number,headRefName,headRefOid,baseRefName,isCrossRepository,mergeable,body,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and .baseRefName == env.BASE_BRANCH
                and (.headRefName | test("^upstream/[0-9]+\\.[0-9]+\\.[0-9]+$"))
                and .mergeable == "MERGEABLE" and (.body | startswith("Port in progress") | not)
                and ([.comments[], .reviews[]] | all(.author.login | IN("claude", "opencode-agent", "coderabbitai")))
                and (any(.comments[]; .body | startswith("Needs a human:")) | not)
                and ([.commits[].authors[].name] | all(. | IN("claude[bot]", "opencode-agent[bot]")))
                and ([.commits[] | select(.messageHeadline | test("^(Fix CI:|Re-run CI$)"))] | length < 3)
                and ([.statusCheckRollup[] | select(.workflowName == "CI")] | group_by(.name)
                  | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT")))
                | {number, branch: .headRefName, head: .headRefOid, failing: true}]'
          }
          base=$(gh api "repos/$GH_REPO/git/ref/heads/$BASE_BRANCH" --jq .object.sha)
          list > /dev/null
          sleep 30
          echo "prs=$(list)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  fix:
    needs: failing
    if: needs.failing.outputs.prs != '' && needs.failing.outputs.prs != '[]'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.failing.outputs.prs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.pr.head }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.failing.outputs.base }}
          path: tmp/default-branch
          sparse-checkout: .github/actions/fix-ci
          persist-credentials: false
      - uses: ./tmp/default-branch/.github/actions/fix-ci
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
          targets: ${{ format('[{0}]', toJSON(matrix.pr)) }}
          base: ${{ env.BASE_BRANCH }}
