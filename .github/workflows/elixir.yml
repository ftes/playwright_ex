name: Elixir CI

on:
  push:
    branches: ["main"]
  # Any base branch, so PRs stacked on another PR's branch get CI too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly, so firefox/webkit regressions show up without a push.
  schedule:
    - cron: "0 3 * * *"
  # The inputs are for experiments; their defaults (and every other event) run the full CI.
  workflow_dispatch:
    inputs:
      max_cases:
        description: "ExUnit max_cases for the test runs (PW_MAX_CASES), default: half the schedulers"
        required: false
        type: string
        default: ""
      browsers:
        description: 'Browsers to test: one name or a JSON list (firefox, ["firefox","webkit"]), default: all'
        required: false
        type: string
        default: ""
      partitions:
        description: "Partitions per browser (1-8), default: firefox 6, others 3"
        required: false
        type: string
        default: ""
      skip_lint:
        description: "Skip the build and lint job (the tests then restore the build cache only)"
        required: false
        type: boolean
        default: false

# A new push to a PR cancels its running CI. Other events (main pushes, the nightly, dispatched
# experiments) get a group of their own: in a shared group GitHub keeps one run pending and cancels
# the older pending one, which would drop a nightly or a main push's cache save, and serialize
# parallel experiments. So does a PR run that tests nothing (a draft, or below the top of its
# stack), so that it can't cancel the tip's test run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) && github.ref || github.run_id }}
  cancel-in-progress: true

# Each job asks for what it needs.
permissions: {}

env:
  MIX_ENV: test

jobs:
  build:
    name: Build and lint
    # Draft PRs skip CI until marked ready, and in a stack only the top PR runs it (the tests need
    # this job): it holds every change below it. `stack` is absent outside a stack and on other events.
    if: ${{ !inputs.skip_lint && !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      # Caches built on another runner image (e.g. ubuntu24 vs ubuntu26) don't fit: PLTs are
      # rejected as "Old PLT file", compiled NIFs and ERTS paths may differ.
      - name: Get runner image
        id: runner_image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # deps and the whole _build (our app too: Mix compares content digests, so a fresh checkout
      # recompiles only what changed, and --warnings-as-errors re-emits the manifest's warnings).
      # Every job restores; this job saves it, on main only (a PR never writes the shared cache).
      # The test jobs build the same MIX_ENV=test tree.
      - &mix-restore
        name: Restore deps and _build
        id: mix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}-
            mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-
          path: |
            deps
            _build
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # A PR never writes the shared cache; `mix dialyzer --plt` builds what a restore lacks.
      - name: Restore Dialyzer PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}
          path: priv/plts
      # Saved right after it is built, so a lint failure doesn't waste the build; `mix lint`'s
      # Dialyzer step then reuses it. Building it compiles the app (dialyxir's `cons_apps` loads
      # it to list the PLT's apps), so an app compile error fails this step.
      - name: Build Dialyzer PLT
        run: mix dialyzer --plt
      - name: Save PLT cache
        if: github.ref == 'refs/heads/main' && steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}
          path: priv/plts
      # mix.exs's `lint`, which `mix check` runs too: format, credo, compile, the usage rules, the
      # Hex package, the docs and Dialyzer.
      - name: Lint
        run: mix lint
      # Last, so only a green job saves; under the key computed before deps.get.
      - name: Save deps and _build
        if: success() && github.ref == 'refs/heads/main' && steps.mix_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &mix-save
          key: ${{ steps.mix_cache.outputs.cache-primary-key }}
          path: |
            deps
            _build

  # The test jobs, one per lane, browser and partition: the browsers (default all) in `partitions`
  # jobs each (default firefox 6, whose slowest sets the run's time, the others 3), on the newest
  # lane, and chromium's on the oldest too. Unconditional: the tests need the build anyway.
  matrix:
    name: Test matrix
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          BROWSERS: ${{ inputs.browsers }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          if [[ -n $PARTITIONS && ! $PARTITIONS =~ ^[1-8]$ ]]; then echo "::error::partitions: 1-8, got: $PARTITIONS"; exit 1; fi
          if [[ -z $BROWSERS ]]; then BROWSERS='["chromium","firefox","webkit"]'; elif [[ $BROWSERS != '['* ]]; then BROWSERS=$(jq -cn --arg b "$BROWSERS" '[$b]'); fi
          include=$(jq -c --arg partitions "$PARTITIONS" '
            if all(.[]; IN("chromium", "firefox", "webkit")) then . else error("browsers: chromium, firefox or webkit, got: \(.)") end
            | [.[] as $browser
              | (if $partitions != "" then $partitions | tonumber elif $browser == "firefox" then 6 else 3 end) as $n
              | (["newest"] + if $browser == "chromium" then ["oldest"] else [] end)[] as $lane
              | range(1; $n + 1) as $partition
              | {lane: $lane, browser: $browser, partition: $partition, partitions: $n}]' <<< "$BROWSERS")
          echo "include=$include" >> "$GITHUB_OUTPUT"

  # Each browser's suite in `partitions` jobs (`mix test --partitions`: test files round-robin by
  # path). Parity, Selenium and headful run once per browser, in partition 1, on the newest lane.
  # The oldest lane (.tool-versions.oldest, mix.exs's floor) runs chromium's main suite only, with
  # warnings allowed so newer backwards-compatible features stay usable: the tests catch what the
  # floor lacks (a call to a missing function is only a compile warning there).
  test:
    name: Test (${{ matrix.lane }}, ${{ matrix.browser }}, ${{ matrix.partition }})
    runs-on: ubuntu-latest
    needs: [build, matrix]
    # After a green build, or none when skip_lint skipped it.
    if: ${{ !cancelled() && needs.matrix.result == 'success' && (needs.build.result == 'success' || (inputs.skip_lint && needs.build.result == 'skipped')) }}
    # The slowest partition took ~12 min at 4 per browser (firefox, with BrowsertypeConnectTest); a
    # hang fails here instead of at GitHub's 6 h.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      BROWSER: ${{ matrix.browser }}
      # The Xvfb of "Start Xvfb".
      DISPLAY: ':99'
      # Empty (the default, and on other events) leaves test_helper.exs's default.
      PW_MAX_CASES: ${{ inputs.max_cases }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select oldest toolchain
        if: matrix.lane == 'oldest'
        run: cp .tool-versions.oldest .tool-versions
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Get runner image
        id: runner_image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Saved on main by the build job (newest) or below (oldest). The key hashes the lane's
      # .tool-versions.
      - *mix-restore
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # --with-deps runs apt-get against the runner's Azure mirror, which has stalled or trickled for
      # whole attempts (webkit pulls ~140 MB). The .debs are cached per browser and driver version, so
      # a warm run installs offline; archive.ubuntu.com is a fallback mirror; apt times out stalled
      # fetches; each attempt is capped, and a killed attempt's apt-get (sudo puts it out of timeout's
      # reach) is killed before the next. The key's day makes main save a fresh cache daily, so
      # Ubuntu's package updates are picked up; restores take the newest. autoclean drops the
      # superseded .debs.
      - name: Restore browser system packages
        id: apt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: apt-${{ matrix.browser }}-${{ hashFiles('DRIVER_VERSION', 'NODE_VERSION') }}-${{ steps.runner_image.outputs.os }}-${{ steps.runner_image.outputs.day }}
          restore-keys: apt-${{ matrix.browser }}-${{ hashFiles('DRIVER_VERSION', 'NODE_VERSION') }}-${{ steps.runner_image.outputs.os }}-
          path: ~/apt-cache
      - name: Install driver and browsers
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\nDPkg::Lock::Timeout "60";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then echo "http://archive.ubuntu.com/ubuntu/" | sudo tee -a /etc/apt/apt-mirrors.txt; fi
          if compgen -G ~/apt-cache/'*.deb' > /dev/null; then sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/; fi
          for attempt in 1 2 3; do
            if timeout 300 mix playwright.install "$BROWSER" --with-deps; then
              sudo apt-get autoclean -qq
              rm -rf ~/apt-cache && mkdir -p ~/apt-cache && cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
              exit 0
            fi
            echo "::warning::browser install attempt $attempt failed or timed out"
            sudo pkill -x apt-get || true
          done
          exit 1
      # One job per browser saves (the partitions and lanes would race for the same key), on main
      # only: a PR's cache is visible to that PR alone.
      - name: Save browser system packages
        if: github.ref == 'refs/heads/main' && matrix.lane == 'newest' && matrix.partition == 1 && steps.apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
          path: ~/apt-cache
      - name: Check parity with upstream
        if: matrix.lane == 'newest' && matrix.browser == 'chromium' && matrix.partition == 1
        run: mix playwright.parity
      # A display like upstream's CI (Linux firefox WebGL needs one): one Xvfb with xvfb-run's
      # defaults, left running for the job. Not xvfb-run: its teardown can exit 5 in place of mix's.
      - name: Start Xvfb
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          pid=$!
          for _ in $(seq 100); do
            if kill -0 "$pid" 2> /dev/null && [[ -S /tmp/.X11-unix/X${DISPLAY#:} ]]; then exit 0; fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/xvfb.log"
          exit 1
      # Test failures (exit 2) are retried once (`mix test --failed`, as the testing guide does), as
      # upstream retries on CI (`retries: 3`); compile errors are not. The first run's failures
      # (Playwright.FailuresFormatter) are its alone, so a green rerun does not hide them. Both runs
      # annotate (Playwright.Test.GitHubFormatter), as upstream annotates every attempt. The rerun
      # takes no --partitions: the failures manifest holds this partition's failures only, and
      # --partitions would split those files again. Warnings fail the newest lane only.
      - name: Run tests
        id: tests
        env:
          PW_FAILURES_FILE: ${{ runner.temp }}/first-run-failures.txt
          PW_MODULE_TIMES_FILE: ${{ runner.temp }}/module-times.txt
          PW_GITHUB_FORMATTER: "1"
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          PARTITIONS: ${{ matrix.partitions }}
          WARNINGS_AS_ERRORS: ${{ matrix.lane == 'newest' && '1' || '' }}
        run: |
          mix test ${WARNINGS_AS_ERRORS:+--warnings-as-errors} --partitions "$PARTITIONS" ||
            { [ $? -eq 2 ] && echo "rerun=true" >> "$GITHUB_OUTPUT" &&
              PW_FAILURES_FILE='' PW_MODULE_TIMES_FILE='' mix test --failed; }
      # The first run's failures to the job summary, and its 10 slowest modules
      # (Playwright.ModuleTimesFormatter): the floor of a partition's time.
      - name: Summarize the first run
        if: ${{ !cancelled() }}
        env:
          PW_FAILURES_FILE: ${{ runner.temp }}/first-run-failures.txt
          PW_MODULE_TIMES_FILE: ${{ runner.temp }}/module-times.txt
          LABEL: ${{ matrix.lane }}, ${{ matrix.browser }}, ${{ matrix.partition }}/${{ matrix.partitions }}
        run: |
          if [[ -s "$PW_MODULE_TIMES_FILE" ]]; then
            echo "Slowest modules ($LABEL), wall ms, setup_all included:"
            sort -rn "$PW_MODULE_TIMES_FILE" | head -n 10
          fi
          if [[ -s "$PW_FAILURES_FILE" ]]; then
            {
              echo "### First-run failures ($LABEL, retried once)"
              echo
              while IFS=$'\t' read -r location name; do echo "- \`$location\` $name"; done < "$PW_FAILURES_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # tests/library/browsertype-launch-selenium.spec.ts, set up as upstream's installation test
      # (connect-to-selenium.spec.ts) does: the two Selenium Server jars (cached; downloaded on
      # chromium only), the runner image's Google Chrome and its ChromeDriver, Java 17 (the image's
      # default 25 is newer than Selenium 3.141.59). The step above skips the spec (no
      # PWTEST_SELENIUM); this one runs only it: the grid tests on chromium, the non-chromium error
      # test (no grid) on firefox and webkit.
      - name: Restore Selenium Server jars
        if: matrix.lane == 'newest' && matrix.browser == 'chromium' && matrix.partition == 1
        id: selenium_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: selenium-server-3.141.59-4.8.3
          path: ~/selenium
      - name: Download Selenium Server jars
        if: matrix.lane == 'newest' && matrix.browser == 'chromium' && matrix.partition == 1 && steps.selenium_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/selenium
          curl -fsSL --retry 3 -o ~/selenium/selenium-server-4.8.3.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.8.0/selenium-server-4.8.3.jar
          curl -fsSL --retry 3 -o ~/selenium/selenium-server-standalone-3.141.59.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar
      - name: Save Selenium Server jars
        if: github.ref == 'refs/heads/main' && steps.selenium_cache.outcome == 'success' && steps.selenium_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.selenium_cache.outputs.cache-primary-key }}
          path: ~/selenium
      - name: Run Selenium tests
        if: matrix.lane == 'newest' && matrix.partition == 1
        run: |
          export PATH=$JAVA_HOME_17_X64/bin:$PATH PWTEST_SELENIUM=$HOME/selenium PWTEST_CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver
          mix test test/upstream/library/browsertype_launch_selenium_test.exs || { [ $? -eq 2 ] && mix test --failed; }
      # Upstream runs headed-only tests (headful.spec.ts, `test.skip(headless)`) in its headed runs
      # (`--headed`); HEADED=1 is that `headless: false` (Playwright.TestBrowser). Only the tests
      # tagged :headed, under the same xvfb and in this job (no extra setup): ~10-20 s of tests.
      # Blocking as the job is: green on all three browsers.
      - name: Run headful tests
        if: matrix.lane == 'newest' && matrix.partition == 1
        env:
          HEADED: "1"
        run: mix test --only headed || { [ $? -eq 2 ] && mix test --failed; }
      # The oldest lane has no build job: one green partition saves its deps and _build, on main
      # only, under the key computed before deps.get.
      - name: Save deps and _build
        if: success() && matrix.lane == 'oldest' && matrix.partition == 1 && github.ref == 'refs/heads/main' && steps.mix_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *mix-save
      # The display is shared by the steps above: its log, in case it went down.
      - name: Show Xvfb log
        if: failure()
        run: cat "$RUNNER_TEMP/xvfb.log" || true
      # Each failed test's error-context.md and artifacts (test_helper.exs's `output_dir`), as the
      # testing guide uploads `test-results`: on a failure or after a rerun, as a green rerun
      # keeps the first run's files. Not on every green job: `preserve_output: :always` keeps the
      # passing tests' output too.
      - name: Upload test results
        if: ${{ failure() || steps.tests.outputs.rerun == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.lane }}-${{ matrix.browser }}-${{ matrix.partition }}
          path: /tmp/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7
          # A re-run of the workflow keeps the first attempt's artifact of the same name.
          overwrite: true

  # The one check to require: green when every lane's and browser's partitions are, which need a
  # green build.
  quality:
    name: quality
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Green without checking on a draft or a PR below the top of its stack, whose jobs above are
      # skipped.
      - if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
