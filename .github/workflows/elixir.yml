# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Nightly, so firefox/webkit regressions show up without a push.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup languages
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      - name: Check Formatting
        run: mix format --check-formatted
      - name: Check Credo
        run: mix credo
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors
      - name: Docs build without warnings
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev
      # PLTs built on another runner image (e.g. ubuntu24 vs ubuntu26) are rejected as "Old PLT file".
      - name: Get runner image
        id: runner_image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Restore Dialyzer PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: plt-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}
          path: priv/plts
      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt
      - name: Save PLT cache
        id: plt_cache_save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.plt_cache.outputs.cache-hit != 'true'
        with:
          key: plt-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          path: priv/plts
      - name: Run Dialyzer
        run: mix dialyzer --format github --format dialyxir

  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: build
    # firefox's slowest run (with retry) is ~40 min; a hang fails here instead of at GitHub's 6 h.
    timeout-minutes: 60
    # firefox is non-blocking until its Linux viewport/worker-timestamp failures are fixed.
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup languages
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # --with-deps runs apt-get against the runner's Azure mirror, which has stalled or trickled for
      # whole attempts (webkit pulls ~140 MB). The .debs are cached per browser and driver version, so
      # a warm run installs offline; archive.ubuntu.com is a fallback mirror; apt times out stalled
      # fetches; each attempt is capped, and a killed attempt's apt-get (sudo puts it out of timeout's
      # reach) is killed before the next.
      - name: Restore browser system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: apt-${{ matrix.browser }}-${{ hashFiles('lib/playwright_ex/driver.ex') }}-ubuntu-26.04
          path: ~/apt-cache
      - name: Install driver and browsers
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\nDPkg::Lock::Timeout "60";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then echo "http://archive.ubuntu.com/ubuntu/" | sudo tee -a /etc/apt/apt-mirrors.txt; fi
          if compgen -G ~/apt-cache/'*.deb' > /dev/null; then sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/; fi
          for attempt in 1 2 3; do
            if timeout 300 mix playwright_ex.install -- ${{ matrix.browser }} --with-deps; then
              mkdir -p ~/apt-cache && cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
              exit 0
            fi
            echo "::warning::browser install attempt $attempt failed or timed out"
            sudo pkill -x apt-get || true
          done
          exit 1
      - name: Check parity with upstream
        if: matrix.browser == 'chromium'
        run: mix playwright_ex.parity
      # Under xvfb like upstream's CI (Linux firefox WebGL needs a display). Test failures (exit 2)
      # are retried once, as upstream retries on CI (`retries: 3`); compile errors are not. The
      # first run's failures (PlaywrightEx.FailuresFormatter) go to the job summary and annotations,
      # so a green rerun does not hide them.
      - name: Run tests
        env:
          PW_FAILURES_FILE: ${{ runner.temp }}/first-run-failures.txt
        run: |
          status=0
          xvfb-run --auto-servernum -- mix test --warnings-as-errors || status=$?
          if [[ -s "$PW_FAILURES_FILE" ]]; then
            {
              echo "### First-run failures ($BROWSER, retried once)"
              echo
              while IFS=$'\t' read -r location name; do echo "- \`$location\` $name"; done < "$PW_FAILURES_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r location name; do
              message="First run failed ($BROWSER): $name"
              message=${message//'%'/'%25'}
              echo "::warning file=${location%:*},line=${location##*:}::$message"
            done < "$PW_FAILURES_FILE"
          fi
          if [[ $status = 2 ]]; then
            PW_FAILURES_FILE= xvfb-run --auto-servernum -- mix test --failed
          else
            exit $status
          fi
      # tests/library/browsertype-launch-selenium.spec.ts, set up as upstream's installation test
      # (connect-to-selenium.spec.ts) does: the two Selenium Server jars (cached; downloaded on
      # chromium only), the runner image's Google Chrome and its ChromeDriver, Java 17 (the image's
      # default 25 is newer than Selenium 3.141.59). The step above skips the spec (no
      # PWTEST_SELENIUM); this one runs only it: the grid tests on chromium, the non-chromium error
      # test (no grid) on firefox and webkit.
      - name: Restore Selenium Server jars
        if: matrix.browser == 'chromium'
        id: selenium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: selenium-server-3.141.59-4.8.3
          path: ~/selenium
      - name: Download Selenium Server jars
        if: matrix.browser == 'chromium' && steps.selenium_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/selenium
          curl -fsSL --retry 3 -o ~/selenium/selenium-server-4.8.3.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.8.0/selenium-server-4.8.3.jar
          curl -fsSL --retry 3 -o ~/selenium/selenium-server-standalone-3.141.59.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar
      - name: Run Selenium tests
        run: |
          export PATH=$JAVA_HOME_17_X64/bin:$PATH PWTEST_SELENIUM=$HOME/selenium PWTEST_CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver
          mix test test/upstream/library/browsertype_launch_selenium_test.exs || if [[ $? = 2 ]]; then mix test --failed; else false; fi
      # Upstream runs headed-only tests (headful.spec.ts, `test.skip(headless)`) in its headed runs
      # (`--headed`); HEADED=1 is that `headless: false` (PlaywrightEx.TestBrowser). Only the tests
      # tagged :headed, under the same xvfb and in this job (no extra setup): ~10-20 s of tests.
      # Blocking as the job is: green on all three browsers.
      - name: Run headful tests
        run: HEADED=1 xvfb-run --auto-servernum -- mix test --only headed || if [[ $? = 2 ]]; then HEADED=1 xvfb-run --auto-servernum -- mix test --failed; else false; fi

  # The one check to require: green when every blocking matrix entry is.
  tests:
    name: Tests
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
