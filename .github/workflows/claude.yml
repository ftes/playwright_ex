name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Each job asks for what it needs.
permissions: {}

env:
  # As in elixir.yml.
  MIX_ENV: test

jobs:
  claude:
    # Maintainers only: the action rejects anyone else, but only after the setup below. A review on
    # a fork's PR gets no secrets.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # On a fork's PR Claude works in its head, where mix would run the fork's mix.exs with the
      # tokens in reach. Empty, so no mix tools, there and when the lookup fails.
      - name: Allow mix tools unless on a fork's PR
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [[ -z $PR || $(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository) == false ]]; then
            echo "mix=,Bash(mix format:*),Bash(mix compile:*),Bash(mix credo:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix playwright.parity:*),Bash(mix playwright.gen.api:*),Bash(mix playwright.gen.protocol:*)" >> "$GITHUB_OUTPUT"
          fi

      # No prompt: Claude follows the comment that tagged it. On main for a comment, the PR's merge
      # ref for a review; the action then switches to the PR's branch.
      - uses: ftes/playwright_ex/.github/actions/claude@main
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          setup: best-effort
          # Lets Claude read CI results on PRs.
          additional-permissions: |
            actions: read
          system-prompt: "Tests can't run here; if your change needs them, say they haven't run. No Claude attribution: leave the Generated with Claude Code signature out of commits, PRs and PR links."
          max-turns: "100"
          allowed-tools: "Skill,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)${{ steps.tools.outputs.mix }}"
