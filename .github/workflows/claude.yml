name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  # As in elixir.yml, whose cache is restored below.
  MIX_ENV: test

jobs:
  claude:
    # Only maintainers: the action rejects anyone else, but only after the setup below.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # On a fork's PR Claude works in the fork's head, where mix runs its mix.exs (and
      # .formatter.exs, .credo.exs) with the Claude and app tokens in reach: no mix tools there,
      # only read-only git and gh. An issue is no PR; a failed lookup fails the job.
      - name: Choose Claude's tools
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=false
          if [[ -n $PR ]]; then
            fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          fi
          tools="Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
          mix="Bash(mix deps.get:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix credo:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix playwright_ex.parity:*),Bash(mix playwright_ex.gen.api:*),Bash(mix playwright_ex.gen.protocol:*)"
          if [[ $fork != false ]]; then echo "::notice::A fork's PR: no mix tools"; else tools="$tools,$mix"; fi
          echo "allowed=$tools" >> "$GITHUB_OUTPUT"
      - name: Setup languages
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Get runner image
        id: runner_image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Main's, saved by elixir.yml's build job under this key. A comment's checkout is main (the
      # action switches to the PR's branch after), so a PR that changes mix.lock needs
      # `mix deps.get`, which Claude may run.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}-
            mix-${{ runner.os }}-${{ steps.runner_image.outputs.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV }}-
          path: |
            deps
            _build
      # deps for the mix tasks below, and upstream's sources at the pin (PlaywrightEx.Upstream) for
      # --add-dir below. Allowed to fail, as on a branch that doesn't compile: Claude then runs
      # without them.
      - name: Install dependencies and upstream sources
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/playwright_ex
          mix "do" deps.get, deps.compile, playwright_ex.upstream

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The owner forbids attribution; AGENTS.md says so too.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
          # No prompt: Claude follows the comment that tagged it. The action adds its own tools (file
          # tools, commit and push, its comment); steps.tools adds read-only git and gh, and the
          # project's mix tasks except on a fork's PR. --add-dir: the driver cache holding the
          # upstream sources. Tests need browsers, so CI runs them.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --add-dir /home/runner/.cache/playwright_ex
            --append-system-prompt "Upstream's sources at the pin (client, server, injected script, specs, API docs) are under ~/.cache/playwright_ex/<version>/upstream; dependencies are in deps/. Tests can't run here: CI runs them on your push."
            --allowedTools "${{ steps.tools.outputs.allowed }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # Only the final message and each denied call's command, path or URL: this repo is public,
        # and the full transcript can contain secrets.
        run: |
          jq -r '.[] | select(.type == "result")
            | (.result // .subtype),
              (.permission_denials // [] | select(length > 0) | "\n**Denied tool calls (\(length)):**\n",
                (.[] | (.tool_input | .command // .file_path // .path // .pattern // .url // "" | gsub("\\s+"; " ") | .[:200]) as $arg
                  | "- \(.tool_name)" + (if $arg == "" then "" else ": `` \($arg) ``" end)))' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

