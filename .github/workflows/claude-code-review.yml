# Accepted risk (.github/actions/claude): with an id-token, the review runs the PR branch's setup
# code. Never on Renovate's PRs.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job asks for what it needs.
permissions: {}

env:
  # As in elixir.yml.
  MIX_ENV: test

jobs:
  claude-review:
    # Claude's own PRs are the only bot PRs reviewed, and fork PRs get no secrets. Never Renovate's
    # branches, whoever opened the PR (see the header).
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Claude actions and prompts from main, not from the ref checked out above
      # (.github/actions/claude): into a gitignored path, after that checkout, which would clean it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tmp/default-branch
          sparse-checkout: .github
          persist-credentials: false
      # A rebase of reviewed changes skips the review; a later push can be reviewed by its
      # increment. Main's script, as for the prompts. Should it fail, Claude reviews it all.
      - name: Compare with the last review
        id: increment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash tmp/default-branch/.github/scripts/claude-review-increment.sh
      - if: steps.increment.outputs.mode != 'skip'
        uses: ./tmp/default-branch/.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          setup: best-effort
          allowed-bots: claude[bot]
          prompt: code-review
          context: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}
            LAST REVIEW: ${{ steps.increment.outputs.note }}
            MARKER: <!-- claude-review: ${{ steps.increment.outputs.head }} ${{ steps.increment.outputs.fork }} -->
          max-turns: "80"
          allowed-tools: "Skill,Read,Grep,Glob,Agent,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"
