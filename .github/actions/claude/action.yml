# What every Claude job shares: the toolchain, claude-code-action with this repo's settings, and
# a step summary safe for a public repo. The caller checks out the code Claude works on and gives
# the job `id-token: write`: the action exchanges the job's OIDC token for the Claude GitHub App's
# token. That exchange checks only the calling workflow file against the default branch's, so
# this action, its prompts (.github/prompts) and summary.jq come from main: a job that checks out
# main uses ./.github/actions/claude, any other also checks out main's .github into
# tmp/default-branch (gitignored) and uses ./tmp/default-branch/.github/actions/claude. Not
# `owner/repo/...@main`: the repo only allows actions pinned to a commit SHA.
#
# Accepted risk: a job with `id-token: write` that checks out a branch other than main runs that
# branch's setup code (mix.exs, deps), which can tamper with the job or mint the app token. Only
# maintainers, Claude's own branches and Renovate can push branches here, and no such job runs on
# Renovate's branches. Fork PRs get no id-token, except a maintainer's comment on one in
# claude.yml: Claude then works in the fork's head with the id-token, and only the mix tools are
# withheld.
name: Claude
description: Runs Claude Code with this repo's model, tool rules and settings.

inputs:
  token:
    description: The CLAUDE_CODE_OAUTH_TOKEN secret.
    required: true
  setup:
    description: "The toolchain, the deps and the upstream sources: `required` (the deps must install; the sources are best effort, as a branch that doesn't compile can't download them), `best-effort` (Claude runs without whatever fails: the toolchain, the deps or the sources) or `none`."
    default: required
  prompt:
    description: "A prompt in .github/prompts, by name (`fix-ci`). None: Claude follows the comment that tagged it."
    default: ""
  context:
    description: "Lines above the prompt (`PR: 12`), which names them."
    default: ""
  system-prompt:
    description: Appended to the system prompt, before the tool rules. Plain text, no double quotes.
    default: ""
  max-turns:
    description: Claude's --max-turns.
    required: true
  allowed-tools:
    description: Claude's --allowedTools, comma-separated.
    required: true
  disallowed-tools:
    description: Claude's --disallowedTools, comma-separated.
    default: ""
  add-dir:
    description: Directories Claude may read besides the checkout and the upstream sources, space-separated.
    default: ""
  allowed-bots:
    description: claude-code-action's allowed_bots.
    default: ""
  additional-permissions:
    description: claude-code-action's additional_permissions.
    default: ""

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        SETUP: ${{ inputs.setup }}
        PROMPT: ${{ inputs.prompt }}
      run: |
        if [[ ! $SETUP =~ ^(required|best-effort|none)$ ]]; then echo "::error::setup: required, best-effort or none, got: $SETUP"; exit 1; fi
        if [[ -n $PROMPT && ! $PROMPT =~ ^[a-z0-9-]+$ ]]; then echo "::error::prompt: a name, got: $PROMPT"; exit 1; fi
    # The summary filter and the prompt from this action's copy (main's), read before the setup
    # runs the checked-out branch's mix.exs, which could rewrite them.
    - name: Read the prompt
      id: prompt
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        CONTEXT: ${{ inputs.context }}
      run: |
        filter=$(cat "$GITHUB_ACTION_PATH/summary.jq")
        eof="EOF_$(openssl rand -hex 16)"
        {
          printf 'summary<<%s\n%s\n%s\n' "$eof" "$filter" "$eof"
          if [[ -n $PROMPT ]]; then
            echo "prompt<<$eof"
            if [[ -n $CONTEXT ]]; then printf '%s\n\n' "$CONTEXT"; fi
            cat "$GITHUB_ACTION_PATH/../../prompts/$PROMPT.md"
            echo "$eof"
          fi
        } >> "$GITHUB_OUTPUT"
    - name: Setup languages
      if: inputs.setup != 'none'
      continue-on-error: ${{ inputs.setup == 'best-effort' }}
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
    - name: Install dependencies
      if: inputs.setup != 'none'
      continue-on-error: ${{ inputs.setup == 'best-effort' }}
      shell: bash
      run: mix "do" deps.get, deps.compile
    - name: Download upstream sources
      if: inputs.setup != 'none'
      continue-on-error: true
      shell: bash
      run: mkdir -p ~/.cache/playwright && mix playwright.upstream
    # The system prompt's line on the upstream sources, only when they are there.
    - name: Find the upstream sources
      id: sources
      shell: bash
      run: |
        mkdir -p ~/.cache/playwright
        if compgen -G "$HOME/.cache/playwright/*/upstream" > /dev/null; then
          echo "line=Upstream's sources at the pin are under ~/.cache/playwright/<version>/upstream." >> "$GITHUB_OUTPUT"
        fi
    # The tool rules steer Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist.
    - name: Run Claude
      id: claude
      uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
      env:
        # Runs subagents in the foreground. A headless run ends with Claude's turn, which drops any
        # still running in the background: they never report back.
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.token }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        allowed_bots: ${{ inputs.allowed-bots }}
        additional_permissions: ${{ inputs.additional-permissions }}
        # The owner forbids attribution; AGENTS.md says so too.
        settings: |
          {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
        claude_args: |
          --model claude-opus-5-5
          --max-turns ${{ inputs.max-turns }}
          --add-dir /home/runner/.cache/playwright ${{ inputs.add-dir }}
          --append-system-prompt "${{ inputs.system-prompt }} ${{ steps.sources.outputs.line }} Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, git -C, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules."
          --allowedTools "${{ inputs.allowed-tools }}"
          ${{ inputs.disallowed-tools != '' && format('--disallowedTools "{0}"', inputs.disallowed-tools) || '' }}
    # summary.jq: only the final message and the denied calls.
    - name: Summarize Claude's result
      if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        FILTER: ${{ steps.prompt.outputs.summary }}
      run: jq -r "$FILTER" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
