# Pushes a fix for a PR whose CI failed, for claude-nightly.yml (simplification PRs) and
# upstream-update.yml (ports). The caller checks out the PR's branch with `persist-credentials:
# false`, gives the job `contents: read`, `actions: read` (the failed log) and `id-token: write`,
# and takes this action from main's copy in tmp/default-branch, as .github/actions/claude says.
# Only new commits, nothing merged from main, so no workflow files (the app can't push those).
name: Fix CI
description: Has Claude fix, re-run or give up on a PR whose CI failed.

inputs:
  token:
    description: The CLAUDE_CODE_OAUTH_TOKEN secret.
    required: true
  kind:
    description: "`nightly` (gives up by closing the PR) or `upstream` (by asking for a human)."
    required: true
  pr:
    description: The PR's number.
    required: true
  branch:
    description: The PR's branch, checked out.
    required: true

runs:
  using: composite
  steps:
    # The number and branch go into the prompt and the allowlist. Only the workflows' own branches
    # (never Renovate's): this job has an id-token and runs the branch's setup.
    - name: Save the failed CI log
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        KIND: ${{ inputs.kind }}
        PR: ${{ inputs.pr }}
        BRANCH: ${{ inputs.branch }}
      run: |
        if [[ ! $KIND =~ ^(nightly|upstream)$ || ! $PR =~ ^[0-9]+$ || ! $BRANCH =~ ^[A-Za-z0-9._/-]+$ ]] ||
          [[ $KIND == nightly && $BRANCH != claude/nightly-* ]] || [[ $KIND == upstream && $BRANCH != upstream/* ]]; then
          echo "::error::bad input: $KIND $PR $BRANCH"
          exit 1
        fi
        # This repository's runs of the checked-out commit only.
        head=$(git rev-parse HEAD)
        # shellcheck disable=SC2016 # jq's $ENV
        run=$(gh api "repos/$GH_REPO/actions/workflows/elixir.yml/runs?branch=$BRANCH&head_sha=$head&event=pull_request&per_page=100" \
          --jq '[.workflow_runs[] | select(.head_repository.full_name == $ENV.GH_REPO)][0].id // empty')
        if [[ -z $run ]]; then echo "::error::no CI run of $BRANCH at $head"; exit 1; fi
        mkdir -p tmp
        gh run view "$run" --log-failed | tail -n 5000 > tmp/ci-failed.log
    - uses: ./tmp/default-branch/.github/actions/claude
      with:
        token: ${{ inputs.token }}
        prompt: fix-ci
        context: |
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }} (${{ inputs.kind == 'nightly' && 'a simplification by the nightly workflow' || 'a draft porting a Playwright release' }})
          BRANCH: ${{ inputs.branch }} (already checked out)
          SUBJECT: ${{ inputs.kind == 'nightly' && 'one imperative sentence (match `git log`)' || '"Fix CI: <one imperative sentence>"' }}
          GIVE UP CONDITION: ${{ inputs.kind == 'nightly' && 'It can''t be fixed without redesigning the change' || 'It needs a redesign of the change, a decision or a skip' }}
          GIVE UP: ${{ inputs.kind == 'nightly' && format('gh pr close {0} --delete-branch --comment "<one sentence on why>"', inputs.pr) || format('gh pr comment {0} --body "Needs a human: <one sentence on why>"', inputs.pr) }}
        # Nightly fixes are small: fewer turns, no subagents.
        max-turns: ${{ inputs.kind == 'nightly' && '60' || '150' }}
        allowed-tools: "Skill,Read,Grep,Glob,Edit,Write,${{ inputs.kind != 'nightly' && 'Agent,Task,' || '' }}Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(mix playwright.parity:*),Bash(mix playwright.gen.api:*),Bash(mix playwright.gen.protocol:*),Bash(gh pr view ${{ inputs.pr }}),Bash(gh pr view ${{ inputs.pr }} *),Bash(gh pr diff ${{ inputs.pr }}),Bash(gh pr diff ${{ inputs.pr }} *),Bash(git push origin ${{ inputs.branch }}),${{ inputs.kind == 'nightly' && format('Bash(gh pr close {0} *)', inputs.pr) || format('Bash(gh pr comment {0} *)', inputs.pr) }}"
