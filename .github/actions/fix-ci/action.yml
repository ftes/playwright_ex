name: Fix port CI
description: Fix a Playwright port at the classified PR head and failing CI attempt.
inputs:
  client-id:
    description: Public OpenCode OIDC client ID.
    required: true
  targets:
    description: One JSON PR snapshot with number, branch, head and failing state.
    required: true
  base:
    description: Default branch name.
    required: true
runs:
  using: composite
  steps:
    - id: prepare
      uses: ftes/ci/opencode-scheduled@922ec907b44a7362091b9e67c1df36620b6c9288 # ftes/ci#18
      with:
        mode: prepare-fix
        client-id: ${{ inputs.client-id }}
        base: ${{ inputs.base }}
        targets: ${{ inputs.targets }}
    - name: Set up toolchain and deps
      if: steps.prepare.outputs.active == 'true'
      uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
    - name: Download upstream sources
      if: steps.prepare.outputs.active == 'true'
      continue-on-error: true
      shell: bash
      run: mix playwright.upstream
    - name: Fix the failed CI attempt
      if: steps.prepare.outputs.active == 'true'
      uses: ftes/ci/opencode-scheduled@922ec907b44a7362091b9e67c1df36620b6c9288 # ftes/ci#18
      with:
        mode: fix
        client-id: ${{ inputs.client-id }}
        targets: ${{ inputs.targets }}
        base: ${{ inputs.base }}
        prompt: |
          Fix the port's CI failure. Read the saved PR metadata and diff and tmp/ci-failed.log.
          Follow AGENTS.md and PORTING.md. The upstream sources may be available under
          ~/.cache/playwright/<version>/upstream. Regenerate generated files through their mix
          tasks. Don't skip or weaken tests or merge or rebase.

          Run `mix format`, `mix compile --warnings-as-errors`, `mix credo` and
          `mix playwright.parity`. CI runs the browser matrix after publication.
          Return fix with a short imperative commit title, retry for an unrelated failure with
          no edits, or give-up with a reason if the port needs a human decision. Return an
          empty threads list.
